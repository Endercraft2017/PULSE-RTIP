name: Android debug release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit to build (release tag must match its short SHA)
        required: true
        default: dev/frontend-webapp
      release_tag:
        required: false
        description: Optional tag; defaults to debug-<source short SHA>
      side_by_side:
        description: Build a separate PULSE 911 Preview installation (Firebase push unavailable)
        type: boolean
        default: false
      prebuilt_ref:
        description: Optional apk-staging-* branch containing a locally signed APK and build-info.json
        required: false

permissions:
  contents: read

concurrency:
  group: android-debug-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SIDE_BY_SIDE: ${{ inputs.side_by_side }}
      PREBUILT_REF: ${{ inputs.prebuilt_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          release_tag="${RELEASE_TAG:-debug-$short_sha}"
          test "$release_tag" = "debug-$short_sha"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          suffix=""
          if [ "$SIDE_BY_SIDE" = true ]; then suffix="-preview"; fi
          echo "APK_NAME=PULSE-911-$short_sha$suffix-debug.apk" >> "$GITHUB_ENV"
          if [ -n "$PREBUILT_REF" ]; then
            case "$PREBUILT_REF" in apk-staging-*) ;; *) echo "Invalid staging ref"; exit 1;; esac
          fi

      - name: Fetch signed build for verification and publication
        if: ${{ inputs.prebuilt_ref != '' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.prebuilt_ref }}
          path: prebuilt
          persist-credentials: false

      - name: Restore persistent debug signing key
        if: ${{ inputs.prebuilt_ref == '' }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure ANDROID_DEBUG_KEYSTORE_BASE64 first. Refusing to publish another APK with a new temporary signing certificate. See docs/android-installation.md."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, base64
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'pulse-debug.keystore'
          key.write_bytes(base64.b64decode(os.environ['DEBUG_KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          PY

      - name: Install frontend tooling and sync Android assets
        if: ${{ inputs.prebuilt_ref == '' }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install cap sync android

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$RUNNER_TEMP/android-tools.zip"
          # Checksum published in Google's signed-over-HTTPS SDK repository metadata.
          printf '%s  %s\n' 5fdcc763663eefb86a5b8879697aa6088b041e70 "$RUNNER_TEMP/android-tools.zip" | sha1sum --check -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          python3 - <<'PY'
          import os, subprocess
          sdk = os.environ['ANDROID_HOME']
          subprocess.run([sdk + '/cmdline-tools/19.0/bin/sdkmanager',
                          '--sdk_root=' + sdk, 'platforms;android-36',
                          'build-tools;35.0.0'], input='y\n' * 100, text=True, check=True)
          PY

      - name: Build debug APK
        if: ${{ inputs.prebuilt_ref == '' }}
        working-directory: android
        run: >-
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug
          -PpulseDebugKeystore="$RUNNER_TEMP/pulse-debug.keystore"
          -PpulseVersionCode="$((GITHUB_RUN_NUMBER + 2))"
          -PpulseVersionName="1.0-debug.${SOURCE_SHA:0:7}"
          -PpulseSideBySide="$SIDE_BY_SIDE"

      - name: Load prebuilt signed APK
        if: ${{ inputs.prebuilt_ref != '' }}
        run: |
          python3 - <<'PY'
          import pathlib, json, os, hashlib, shutil
          stage=pathlib.Path('prebuilt')
          info=json.loads((stage/'build-info.json').read_text())
          assert info['source_commit']==os.environ['SOURCE_SHA']
          artifact=stage/'app-debug.apk'
          assert hashlib.sha256(artifact.read_bytes()).hexdigest()==info['apk_sha256']
          output=pathlib.Path('android/app/build/outputs/apk/debug/app-debug.apk')
          output.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(artifact,output)
          PY

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('src/frontend')
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['index.html', 'public/vendor/leaflet/leaflet.js',
                           'public/vendor/leaflet/leaflet.css',
                           'public/js/components/incident-map.js',
                           'public/js/components/hazard-map.js',
                           'public/js/utils/store.js', 'public/js/utils/push.js']:
                  assert apk.read('assets/public/' + name) == (root / name).read_bytes(), name
          PY
          python3 - <<'PY'
          import subprocess, os, re
          aapt=os.environ['ANDROID_HOME']+'/build-tools/35.0.0/aapt'
          metadata=subprocess.check_output([aapt,'dump','badging','android/app/build/outputs/apk/debug/app-debug.apk'],text=True)
          expected='com.mdrrmo.pulse911'+('.preview' if os.environ['SIDE_BY_SIDE']=='true' else '')
          assert re.search(r"package: name='([^']+)'",metadata).group(1)==expected
          PY
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/$APK_NAME"
          (cd release-assets && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK and publish debug prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Interactive Leaflet maps for report and hazard pin editing. No Google Maps API key or billing account required.

          Source commit: $SOURCE_SHA
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Android debug APK verified and published by GitHub Actions. When a prebuilt staging ref is supplied, the APK was signed locally; source commit, checksum, signature, package ID and bundled assets are checked before publication. Not tested on a physical phone.

          Uses the repository's persistent debug signing key. Older temporary-key builds cannot be updated without their original key. Preserve unsynced data. A Preview build installs separately; Firebase push is unavailable in Preview. This is a test build, not a production-signed release.

          Coordinate saves still require an assigned admin agency and approved territory configuration. APK checksum is included as a separate download.
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "PULSE 911 - Leaflet maps ($RELEASE_TAG)" --draft --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release-assets/$APK_NAME" "release-assets/$APK_NAME.sha256"
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
