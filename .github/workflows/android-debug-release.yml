name: Android debug release

on:
  push:
    branches: [dev/frontend-webapp]
    paths: [.github/workflows/android-debug-release.yml]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit to build (release tag must match its short SHA)
        required: true
        default: 381638a925e2d2f05c62625b94bfd680f824ac7e
      release_tag:
        description: Debug release tag
        required: true
        default: debug-381638a

permissions:
  contents: read

concurrency:
  group: android-debug-${{ inputs.release_tag || 'debug-381638a' }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      SOURCE_REF: ${{ inputs.source_ref || '381638a925e2d2f05c62625b94bfd680f824ac7e' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'debug-381638a' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          short_sha=$(git rev-parse --short=7 HEAD)
          test "$RELEASE_TAG" = "debug-$short_sha"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "APK_NAME=PULSE-911-$short_sha-debug.apk" >> "$GITHUB_ENV"

      - name: Install frontend tooling and sync Android assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install cap sync android

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip --output "$RUNNER_TEMP/android-tools.zip"
          # Checksum published in Google's signed-over-HTTPS SDK repository metadata.
          printf '%s  %s\n' 5fdcc763663eefb86a5b8879697aa6088b041e70 "$RUNNER_TEMP/android-tools.zip" | sha1sum --check -
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          python3 - <<'PY'
          import os, subprocess
          sdk = os.environ['ANDROID_HOME']
          subprocess.run([sdk + '/cmdline-tools/19.0/bin/sdkmanager',
                          '--sdk_root=' + sdk, 'platforms;android-36',
                          'build-tools;35.0.0'], input='y\n' * 100, text=True, check=True)
          PY

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('src/frontend')
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              for name in ['index.html', 'public/vendor/leaflet/leaflet.js',
                           'public/vendor/leaflet/leaflet.css',
                           'public/js/components/incident-map.js',
                           'public/js/components/hazard-map.js']:
                  assert apk.read('assets/public/' + name) == (root / name).read_bytes(), name
          PY
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/$APK_NAME"
          (cd release-assets && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-${{ github.run_id }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK and publish debug prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Interactive Leaflet maps for report and hazard pin editing. No Google Maps API key or billing account required.

          Source commit: $SOURCE_SHA
          Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Android debug APK built by GitHub Actions. APK signature and bundled Leaflet assets verified. Not tested on a physical phone.

          This build uses a temporary debug signing key. Updating an existing app requires a matching signing key; preserve unsynced data. This is a test build, not a production-signed release.

          Coordinate saves still require an assigned admin agency and approved territory configuration. APK checksum is included as a separate download.
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "PULSE 911 - Leaflet maps ($RELEASE_TAG)" --draft --prerelease --latest=false --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release-assets/$APK_NAME" "release-assets/$APK_NAME.sha256"
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
